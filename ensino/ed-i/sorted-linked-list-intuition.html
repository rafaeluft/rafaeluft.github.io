<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prof. Rafael · Lista encadeada ordenada · Inserção ordenada (intuição)</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="../../assets/sim/simulador.css">
  <script src="../../assets/sim/simulador.js"></script>
  <style>
    .sim-barra .btn-inserir { white-space: nowrap; }

    body.sim-pagina { --sim-fonte-no: 1.15rem; }
    body.sim-apresentacao { --sim-fonte-no: 1.5rem; }

    #palco { --ll-dur: 800ms; --ll-flash: 1800ms; }

    #velocidade { width: 8rem; accent-color: var(--coral); cursor: pointer; }
    #velocidadeValor {
      min-width: 3.2rem;
      font-family: ui-monospace, Menlo, monospace;
      font-size: .9rem;
      color: var(--cinza);
    }
    body.sim-apresentacao #velocidade { width: 11rem; height: 28px; }
    body.sim-apresentacao #velocidadeValor { font-size: 1.15rem; }

    .ll-no, .ll-desc {
      cursor: default;
      z-index: 2;
      transition: left var(--ll-dur) ease-in-out, top var(--ll-dur) ease-in-out, opacity var(--ll-dur) ease;
    }
    .ll-desc { align-items: flex-start; }
    .ll-desc .sim-end { white-space: nowrap; }
    .ll-desc .sim-end b { font-size: 1.2em; }

    .ll-badges {
      min-height: 1.9em;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .ll-badge {
      visibility: hidden;
      font-size: 1.15em;
      font-weight: 800;
      letter-spacing: .06em;
      line-height: 1.4;
      color: #fff;
      background: var(--coral);
      border-radius: 999px;
      padding: .05em .7em;
    }
    .ll-no.novo .ll-badge { visibility: visible; }

    .ll-moldura, .ll-aux {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      pointer-events: none;
      font-size: var(--sim-fonte-no, .9rem);
      transition: left var(--ll-dur) ease-in-out, top var(--ll-dur) ease-in-out,
                  width var(--ll-dur) ease-in-out, height var(--ll-dur) ease-in-out, opacity var(--ll-dur) ease;
    }
    .ll-moldura {
      z-index: 1;
      border: 4px solid var(--coral);
      border-radius: 18px;
      background: rgba(224, 111, 114, .10);
    }
    .ll-moldura-rotulo {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: .1em;
      line-height: 1.1;
      font-size: 1.6em;
      font-weight: 800;
      letter-spacing: .04em;
      color: var(--coral);
      white-space: nowrap;
    }
    .ll-aux {
      z-index: 3;
      border: 4px solid #2f6fb5;
      border-radius: 14px;
      background: rgba(47, 111, 181, .22);
    }
    .ll-aux-rotulo {
      position: absolute;
      top: .1em;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.5em;
      font-weight: 800;
      line-height: 1.2;
      color: #fff;
      background: #2f6fb5;
      border-radius: 999px;
      padding: 0 .6em;
    }

    .ll-aux.nulo { border-style: dashed; background: rgba(47, 111, 181, .08); }
    .ll-aux.nulo .ll-aux-rotulo::after { content: ' = NULL'; }

    .btn-percorrer { background: #2f6fb5; color: #fff; }
    .btn-percorrer:hover:not(:disabled) { background: #4a86c8; }
    #saidaBtn[aria-pressed="true"] { border-color: #2f6fb5; color: #2f6fb5; }

    .ll-saida {
      position: absolute;
      z-index: 10;
      width: 280px;
      height: 240px;
      min-width: 160px;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      background: var(--papel);
      border: 2px solid #2f6fb5;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .18);
      resize: both;
      overflow: hidden;
    }
    .ll-saida[hidden] { display: none; }
    .ll-saida-topo {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px 4px 12px;
      background: #2f6fb5;
      color: #fff;
      cursor: move;
      touch-action: none;
      user-select: none;
    }
    .ll-saida-titulo { flex: 1 1 auto; font-weight: 700; font-size: 1rem; letter-spacing: .04em; }
    .ll-saida-topo button {
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 7px;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      font: 700 1.2rem/1 inherit;
      cursor: pointer;
    }
    .ll-saida-topo button:hover { background: rgba(255, 255, 255, .35); }
    .ll-saida-corpo {
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      padding: .3em .6em 1.2em;
      font-family: ui-monospace, Menlo, monospace;
      font-size: var(--saida-fonte, 1.8rem);
      line-height: 1.3;
      white-space: pre;
    }
    .ll-saida-corpo .ll-flash { animation: llFlash var(--ll-flash) ease-out; border-radius: 6px; }
    body.sim-apresentacao .ll-saida-titulo { font-size: 1.3rem; }
    body.sim-apresentacao .ll-saida-topo button { width: 40px; height: 40px; font-size: 1.5rem; }

    .ll-sem-transicao { transition: none !important; }

    .sim-valor.ll-flash { animation: llFlash var(--ll-flash) ease-out; }
    @keyframes llFlash {
      0%, 20% { background: #e06f72; color: #fff; }
      100% { background: transparent; }
    }
  </style>

<script>
(function () {
  // ---------- Constantes e estado ----------
  var fmtEnd = SimLista.fmtEnd;
  var SVG_NS = 'http://www.w3.org/2000/svg';
  var DESC = 0x100;
  var BASE = 0x110;
  var TOPO = 10;
  var ESQ = 10;
  var FP = 16;
  var AP = 6;
  var GAP = 90;
  var MOVER_MS = 800;
  var FLASH_MS = 1800;
  var PASSO_MS = 1900;

  var heapCount = 0;
  var base = vazio();
  var atual = base;
  var op = null;
  var tocando = false;
  var timer = null;
  var velocidade = 1;
  var zoom = 1;
  var msgManual = null;

  function vazio() {
    return { inicio: null, nos: {}, pos: {}, frame: null, aux: null, auxNulo: false, novo: null, saida: [], texto: '' };
  }
  function clonar(s) { return JSON.parse(JSON.stringify(s)); }

  function cadeiaDe(s) {
    var c = [];
    var vistos = {};
    var cur = s.inicio;
    while (typeof cur === 'number' && s.nos[cur] && !vistos[cur]) {
      vistos[cur] = true;
      c.push(cur);
      cur = s.nos[cur].prox;
    }
    return c;
  }

  // ---------- Código-fonte das operações ----------
  var CODIGOS = {
    inserir: [
      'void TLinkedList_inserir_ordenado(TLinkedList* lista, int valor){',
      '    TNo* novo = malloc(sizeof(TNo));',
      '    novo->info = valor;',
      '    if(lista->inicio == NULL || valor <= lista->inicio->info){',
      '        novo->prox = lista->inicio;',
      '        lista->inicio = novo;',
      '    }else{',
      '        TNo* ant = lista->inicio;',
      '        while(ant->prox != NULL && ant->prox->info < valor){',
      '            ant = ant->prox;',
      '        }',
      '        novo->prox = ant->prox;',
      '        ant->prox = novo;',
      '    }',
      '}'
    ],
    percorrer: [
      'void TLinkedList_percorrer(TLinkedList* lista){',
      '    TNo* aux = lista->inicio;',
      '    while(aux != NULL){',
      '        printf("%d\\n", aux->info);',
      '        aux = aux->prox;',
      '    }',
      '}'
    ]
  };

  // ---------- Geração dos passos (cada passo é um retrato completo do estado + linha do código) ----------
  function criarGerador(texto0) {
    var snaps = [clonar(base)];
    snaps[0].texto = texto0;
    snaps[0].linha = 1;
    return {
      snaps: snaps,
      passo: function (linha, texto, fn) {
        var s = clonar(snaps[snaps.length - 1]);
        if (fn) fn(s);
        s.texto = texto;
        s.linha = linha;
        snaps.push(s);
      }
    };
  }

  function gerarPercorrer() {
    var g = criarGerador('Chamada de TLinkedList_percorrer(lista).');
    var passo = g.passo;
    var cadeia = cadeiaDe(base);
    var n = cadeia.length;
    passo(2, 'aux recebe lista->inicio' + (n === 0 ? ', que é NULL.' : ': começa no primeiro nó (' + fmtEnd(cadeia[0]) + ').'), function (s) {
      s.saida = [];
      s.aux = 0;
      s.auxNome = 'aux';
      s.auxNulo = n === 0;
    });
    cadeia.forEach(function (id, k) {
      var info = base.nos[id].info;
      var prox = k + 1 < n ? cadeia[k + 1] : null;
      passo(3, 'aux != NULL? Sim: entra no laço.');
      passo(4, 'printf imprime aux->info (' + info + ').', function (s) { s.saida.push(String(info)); });
      passo(5, 'aux = aux->prox (' + fmtEnd(prox) + ').', function (s) {
        s.aux = k + 1;
        s.auxNulo = prox === null;
      });
    });
    passo(3, 'aux != NULL? Não: aux é NULL, o laço termina.');
    passo(7, 'Percurso concluído.', function (s) { s.aux = null; s.auxNulo = false; });
    return g.snaps;
  }

  function gerarPassos(tipo, valor) {
    if (tipo === 'percorrer') return gerarPercorrer();
    var g = criarGerador('Chamada de TLinkedList_inserir_ordenado(lista, ' + valor + ').');
    var passo = g.passo;
    var a = BASE + (heapCount++) * 0x10;
    var cadeia = cadeiaDe(base);
    var n = cadeia.length;
    var info = function (i) { return base.nos[cadeia[i]].info; };

    passo(2, 'malloc aloca um novo nó em ' + fmtEnd(a) + ' (novo). Seus campos ainda contêm lixo.', function (s) {
      s.nos[a] = { info: '?', prox: '?' };
      s.pos[a] = 'f';
      s.novo = a;
    });
    passo(3, 'novo->info recebe ' + valor + '.', function (s) { s.nos[a].info = valor; });

    if (n === 0 || valor <= info(0)) {
      passo(4, n === 0
        ? 'lista->inicio == NULL? Sim: a lista está vazia, o novo nó será o primeiro.'
        : valor + ' <= ' + info(0) + ' (info do primeiro nó)? Sim: o novo nó deve ficar no início.');
      passo(5, n === 0
        ? 'novo->prox recebe lista->inicio, que é NULL.'
        : 'novo->prox recebe lista->inicio (' + fmtEnd(base.inicio) + '): o novo nó aponta para o atual primeiro nó.',
        function (s) { s.nos[a].prox = base.inicio; });
      passo(6, n === 0
        ? 'O novo nó vai para a primeira posição da lista.'
        : 'Abre espaço: os nós são empurrados para a direita e o novo nó ocupa a primeira posição.',
        function (s) {
          cadeia.forEach(function (id) { s.pos[id] += 1; });
          s.pos[a] = 0;
          if (s.frame !== null) s.frame += 1;
        });
      passo(6, 'lista->inicio = novo (' + fmtEnd(a) + '). Ele agora é o início da lista.', function (s) {
        s.inicio = a;
        s.frame = 0;
      });
      passo(15, 'Inserção ordenada concluída: ' + valor + ' entrou no início.', function (s) { s.novo = null; });
      return g.snaps;
    }

    passo(4, valor + ' <= ' + info(0) + ' (info do primeiro nó)? Não: o novo nó vai depois do início, segue para o else.');
    passo(8, 'ant recebe lista->inicio: começa no primeiro nó (' + fmtEnd(cadeia[0]) + ').', function (s) {
      s.aux = 0;
      s.auxNome = 'ant';
      s.auxNulo = false;
    });
    var k = 0;
    while (k + 1 < n && info(k + 1) < valor) {
      passo(9, 'ant->prox != NULL e ' + info(k + 1) + ' < ' + valor + '? Sim: ainda não chegou à posição.');
      k++;
      var kk = k;
      passo(10, 'ant = ant->prox (' + fmtEnd(cadeia[k]) + ').', function (s) { s.aux = kk; });
    }
    passo(9, k + 1 >= n
      ? 'ant->prox != NULL? Não: ant está no último nó, o laço termina.'
      : 'ant->prox != NULL e ' + info(k + 1) + ' < ' + valor + '? Não: o novo nó deve ficar logo depois de ant.');
    var seguinte = k + 1 < n ? cadeia[k + 1] : null;
    passo(12, 'novo->prox recebe ant->prox (' + fmtEnd(seguinte) + ')' +
      (seguinte === null ? ': o novo nó será o último.' : ': o novo nó aponta para o nó que vinha depois de ant.'),
      function (s) { s.nos[a].prox = seguinte; });
    passo(13, seguinte === null
      ? 'O novo nó vai para o fim da lista, logo depois de ant.'
      : 'Abre espaço: os nós depois de ant são empurrados para a direita e o novo nó ocupa a posição.',
      function (s) {
        cadeia.slice(k + 1).forEach(function (id) { s.pos[id] += 1; });
        s.pos[a] = k + 1;
      });
    passo(13, 'ant->prox = novo: o nó ' + fmtEnd(cadeia[k]) + ' passa a apontar para o novo nó.', function (s) {
      s.nos[cadeia[k]].prox = a;
    });
    passo(15, 'Inserção ordenada concluída: ' + valor + ' entrou na posição ' + (k + 2) + '.', function (s) {
      s.novo = null;
      s.aux = null;
    });
    return g.snaps;
  }

  // ---------- Palco ----------
  var palcoEl = document.getElementById('palco');
  var viewport = document.createElement('div');
  viewport.className = 'sim-viewport';
  var molde = document.createElement('div');
  molde.className = 'sim-molde';
  var camada = document.createElement('div');
  camada.className = 'sim-camada';
  camada.style.transform = 'scale(1)';
  var svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('class', 'sim-setas');
  svg.innerHTML = '<defs><marker id="ll-marcador" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">' +
    '<path d="M0,0 L10,5 L0,10 z" style="fill:var(--cinza)"/></marker></defs><g></g>';
  var setasG = svg.querySelector('g');
  camada.appendChild(svg);
  molde.appendChild(camada);
  viewport.appendChild(molde);
  palcoEl.appendChild(viewport);

  var descEl = document.createElement('div');
  descEl.className = 'sim-no desc ll-desc';
  descEl.innerHTML = '<div class="sim-end"><b>lista</b> · TLinkedList · ' + fmtEnd(DESC) + '</div>' +
    '<div class="sim-caixa"><div class="sim-campo"><span class="sim-nome">inicio</span>' +
    '<span class="sim-valor sim-para" data-campo="inicio">NULL</span></div></div>';
  camada.appendChild(descEl);
  var descValor = descEl.querySelector('[data-campo=inicio]');

  var frameEl = document.createElement('div');
  frameEl.className = 'll-moldura';
  frameEl.innerHTML = '<span class="ll-moldura-rotulo">início</span>';
  camada.appendChild(frameEl);

  var auxEl = document.createElement('div');
  auxEl.className = 'll-aux';
  auxEl.innerHTML = '<span class="ll-aux-rotulo">aux</span>';
  var auxRotulo = auxEl.querySelector('.ll-aux-rotulo');
  camada.appendChild(auxEl);

  var els = {};

  function duracao() { return MOVER_MS / velocidade; }

  function criarNo(addr) {
    var el = document.createElement('div');
    el.className = 'sim-no ll-no';
    el.innerHTML = '<div class="ll-badges"><span class="ll-badge">novo</span></div>' +
      '<div class="sim-end">' + fmtEnd(addr) + '</div>' +
      '<div class="sim-caixa">' +
      '<div class="sim-campo"><span class="sim-nome">info</span><span class="sim-valor" data-campo="info"></span></div>' +
      '<div class="sim-campo"><span class="sim-nome">prox</span><span class="sim-valor" data-campo="prox"></span></div>' +
      '</div>';
    camada.appendChild(el);
    return el;
  }

  function setValor(span, texto, lixo, flash) {
    if (span.textContent === texto) return;
    span.textContent = texto;
    span.classList.toggle('sim-lixo', lixo);
    span.classList.toggle('sim-para', texto === 'NULL');
    if (flash) {
      span.classList.remove('ll-flash');
      void span.offsetWidth;
      span.classList.add('ll-flash');
    }
  }

  function renderizar(s) {
    var novos = [];
    Object.keys(els).forEach(function (k) {
      if (s.nos[k]) return;
      var el = els[k];
      delete els[k];
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, duracao());
    });
    Object.keys(s.nos).forEach(function (k) {
      var el = els[k];
      var criado = !el;
      if (criado) {
        el = els[k] = criarNo(Number(k));
        novos.push(el);
      }
      var n = s.nos[k];
      setValor(el.querySelector('[data-campo=info]'), n.info === '?' ? '?' : String(n.info), n.info === '?', !criado);
      setValor(el.querySelector('[data-campo=prox]'), n.prox === '?' ? '?' : fmtEnd(n.prox), n.prox === '?', !criado);
      el.classList.toggle('novo', s.novo !== null && Number(k) === s.novo);
    });
    setValor(descValor, fmtEnd(s.inicio), false, true);
    auxEl.classList.toggle('nulo', !!s.auxNulo);
    auxRotulo.textContent = s.auxNome || 'aux';
    renderSaida(s.saida || []);
    atual = s;
    posicionar(novos);
  }

  function medidas() {
    var m = { descW: descEl.offsetWidth, descH: descEl.offsetHeight, W: 0, H: 0 };
    Object.keys(els).forEach(function (k) {
      m.W = Math.max(m.W, els[k].offsetWidth);
      m.H = Math.max(m.H, els[k].offsetHeight);
    });
    if (!m.W) { m.W = 180; m.H = 140; }
    return m;
  }

  function posicionarCaixa(el, slot, xSlot, y, m, pad) {
    if (slot === null || slot === undefined) {
      el.style.opacity = '0';
      return;
    }
    var visivel = el.style.opacity === '1';
    if (!visivel) el.classList.add('ll-sem-transicao');
    el.style.left = (xSlot(slot) - pad) + 'px';
    el.style.top = (y - pad) + 'px';
    el.style.width = (m.W + 2 * pad) + 'px';
    el.style.height = (m.H + 2 * pad) + 'px';
    if (!visivel) {
      void el.offsetWidth;
      el.classList.remove('ll-sem-transicao');
    }
    el.style.opacity = '1';
  }

  function posicionar(novos) {
    var s = atual;
    var m = medidas();
    descEl.style.left = ESQ + 'px';
    descEl.style.top = TOPO + 'px';
    var linhaY = TOPO + Math.max(m.descH, m.H) + 70 + FP;
    var xSlot = function (i) { return ESQ + FP + i * (m.W + GAP); };
    var xFlut = ESQ + m.descW + GAP;
    var maxX = ESQ + m.descW;
    var maxY = TOPO + m.descH;

    Object.keys(s.nos).forEach(function (k) {
      var el = els[k];
      var p = s.pos[k];
      var x = p === 'f' ? xFlut : xSlot(p);
      var y = p === 'f' ? TOPO : linhaY;
      if (novos.indexOf(el) !== -1) {
        el.classList.add('ll-sem-transicao');
        el.style.opacity = '0';
      }
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      maxX = Math.max(maxX, x + m.W);
      maxY = Math.max(maxY, y + m.H + FP + 70);
    });
    novos.forEach(function (el) {
      void el.offsetWidth;
      el.classList.remove('ll-sem-transicao');
      el.style.opacity = '1';
    });

    posicionarCaixa(frameEl, s.frame, xSlot, linhaY, m, FP);
    posicionarCaixa(auxEl, s.aux, xSlot, linhaY, m, AP);
    if (s.aux !== null) maxX = Math.max(maxX, xSlot(s.aux) + m.W + AP);

    var w = maxX + 60;
    var h = maxY + 20;
    molde.style.width = w * zoom + 'px';
    molde.style.height = h * zoom + 'px';
    svg.setAttribute('width', String(w));
    svg.setAttribute('height', String(h));
    svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
    animarSetas(duracao() + 150);
  }

  // ---------- Setas (ponteiros prox) ----------
  function desenharSetas() {
    while (setasG.firstChild) setasG.removeChild(setasG.firstChild);
    var c = camada.getBoundingClientRect();
    var z = zoom;
    Object.keys(atual.nos).forEach(function (k) {
      var alvo = atual.nos[k].prox;
      if (typeof alvo !== 'number' || !els[k] || !els[alvo]) return;
      var cr = els[k].querySelector('[data-campo=prox]').getBoundingClientRect();
      var dr = els[alvo].querySelector('.sim-caixa').getBoundingClientRect();
      var sx = (cr.right - c.left) / z;
      var sy = (cr.top - c.top) / z + (cr.height / z) / 2;
      var dx = (dr.left - c.left) / z;
      var dy = (dr.top - c.top) / z;
      var ex, ey, c1x, c1y, c2x, c2y;
      if (dx - sx > 6) {
        ex = dx;
        ey = dy + (dr.height / z) / 2;
        c1x = (sx + ex) / 2; c1y = sy;
        c2x = (sx + ex) / 2; c2y = ey;
      } else {
        ex = dx + (dr.width / z) / 2;
        ey = dy;
        c1x = sx + 60; c1y = sy;
        c2x = ex; c2y = dy - 80;
      }
      var p = document.createElementNS(SVG_NS, 'path');
      p.setAttribute('d', 'M' + sx + ' ' + sy + ' C' + c1x + ' ' + c1y + ' ' + c2x + ' ' + c2y + ' ' + ex + ' ' + ey);
      p.setAttribute('class', 'sim-seta');
      p.setAttribute('marker-end', 'url(#ll-marcador)');
      setasG.appendChild(p);
    });
  }

  var fimSetas = 0;
  var rafSetas = null;
  function animarSetas(ms) {
    fimSetas = Math.max(fimSetas, performance.now() + ms);
    if (rafSetas) return;
    var tick = function () {
      desenharSetas();
      rafSetas = performance.now() < fimSetas ? requestAnimationFrame(tick) : null;
    };
    rafSetas = requestAnimationFrame(tick);
  }

  // ---------- Reprodução ----------
  var ICONE_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg>';
  var ICONE_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>';

  function ultimoIdx() { return op ? op.snaps.length - 1 : 0; }

  function irPara(i) {
    op.i = i;
    renderizar(op.snaps[i]);
    renderUI();
  }

  function agendar() {
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (!tocando || !op) return;
      if (op.i < ultimoIdx()) irPara(op.i + 1);
      if (op.i >= ultimoIdx()) pausar();
      else agendar();
    }, PASSO_MS / velocidade);
  }

  function tocar() {
    if (!op || op.i >= ultimoIdx()) return;
    tocando = true;
    agendar();
    renderUI();
  }

  function pausar() {
    tocando = false;
    clearTimeout(timer);
    renderUI();
  }

  function proximo() {
    if (!op) return;
    pausar();
    if (op.i < ultimoIdx()) irPara(op.i + 1);
  }

  function voltar() {
    if (!op) return;
    pausar();
    if (op.i > 0) irPara(op.i - 1);
  }

  function concluirTudo() {
    if (!op) return;
    pausar();
    if (op.i < ultimoIdx()) irPara(ultimoIdx());
  }

  function iniciarOperacao(tipo) {
    var v = document.getElementById('valor').value.trim();
    if (tipo !== 'percorrer' && (v === '' || !Number.isInteger(Number(v)))) {
      setMsg('Digite um número inteiro.', true);
      return;
    }
    if (op) {
      pausar();
      if (op.i < ultimoIdx()) irPara(ultimoIdx());
      base = clonar(op.snaps[ultimoIdx()]);
      base.novo = null;
      base.aux = null;
      base.auxNulo = false;
    }
    if (tipo === 'percorrer') mostrarSaida(true);
    op = { tipo: tipo, snaps: null, i: 0 };
    op.snaps = gerarPassos(tipo, Number(v));
    setMsg('');
    irPara(0);
    tocar();
  }

  // ---------- Interface ----------
  function renderUI() {
    var fim = !op || op.i >= ultimoIdx();
    document.getElementById('voltarBtn').disabled = !op || op.i === 0;
    document.getElementById('proximoBtn').disabled = fim;
    document.getElementById('concluirBtn').disabled = fim;
    var play = document.getElementById('playBtn');
    play.disabled = fim;
    var rotulo = tocando ? 'Pausar' : 'Reproduzir';
    if (play.getAttribute('data-estado') !== rotulo) {
      play.innerHTML = tocando ? ICONE_PAUSE : ICONE_PLAY;
      play.setAttribute('data-estado', rotulo);
      play.title = rotulo;
      play.setAttribute('aria-label', rotulo);
    }
    renderMsg();
  }

  function renderMsg() {
    if (msgManual) return;
    var m = document.getElementById('msg');
    m.classList.remove('erro');
    if (!op) {
      m.textContent = 'Digite um valor e clique em "Inserir": a lista se mantém em ordem crescente.';
    } else if (op.i === 0 || op.i >= ultimoIdx()) {
      m.textContent = op.snaps[op.i].texto;
    } else {
      m.textContent = 'Passo ' + op.i + ' de ' + (ultimoIdx() - 1) + ' — ' + op.snaps[op.i].texto;
    }
  }

  function setMsg(t, erro) {
    msgManual = t === '' ? null : { t: t, erro: !!erro };
    var m = document.getElementById('msg');
    m.textContent = t;
    m.classList.toggle('erro', !!erro);
    if (!msgManual) renderMsg();
  }

  // ---------- Painel de saída ----------
  var saidaEl = document.getElementById('saida');
  var saidaCorpo = document.getElementById('saidaCorpo');
  var saidaBtn = document.getElementById('saidaBtn');
  var saidaFonte = 1.8;
  var saidaPosicionada = false;

  function renderSaida(linhas) {
    var atuais = saidaCorpo.children;
    var antes = atuais.length;
    while (atuais.length > linhas.length) saidaCorpo.removeChild(saidaCorpo.lastChild);
    for (var i = 0; i < linhas.length; i++) {
      var d = atuais[i];
      if (!d) {
        d = document.createElement('div');
        saidaCorpo.appendChild(d);
      }
      d.textContent = linhas[i];
      if (i >= antes) {
        d.classList.add('ll-flash');
        saidaCorpo.scrollTop = saidaCorpo.scrollHeight;
      }
    }
  }

  function limitarSaida(x, y) {
    var maxX = Math.max(0, palcoEl.clientWidth - saidaEl.offsetWidth);
    var maxY = Math.max(0, palcoEl.clientHeight - saidaEl.offsetHeight);
    saidaEl.style.left = Math.min(maxX, Math.max(0, x)) + 'px';
    saidaEl.style.top = Math.min(maxY, Math.max(0, y)) + 'px';
  }

  function mostrarSaida(mostrar) {
    saidaEl.hidden = !mostrar;
    saidaBtn.setAttribute('aria-pressed', mostrar ? 'true' : 'false');
    if (mostrar && !saidaPosicionada) {
      saidaPosicionada = true;
      limitarSaida(palcoEl.clientWidth - saidaEl.offsetWidth - 12, 12);
    }
  }

  function mudarFonteSaida(delta) {
    saidaFonte = Math.min(6, Math.max(0.8, Math.round((saidaFonte + delta) * 10) / 10));
    saidaEl.style.setProperty('--saida-fonte', saidaFonte + 'rem');
  }

  saidaBtn.addEventListener('click', function () { mostrarSaida(saidaEl.hidden); });
  document.getElementById('saidaFechar').addEventListener('click', function () { mostrarSaida(false); });
  document.getElementById('saidaMais').addEventListener('click', function () { mudarFonteSaida(0.3); });
  document.getElementById('saidaMenos').addEventListener('click', function () { mudarFonteSaida(-0.3); });

  var saidaTopo = document.getElementById('saidaTopo');
  saidaTopo.addEventListener('pointerdown', function (ev) {
    if (ev.target.closest('button')) return;
    if (ev.button !== 0 && ev.pointerType === 'mouse') return;
    var dx = ev.clientX - saidaEl.offsetLeft;
    var dy = ev.clientY - saidaEl.offsetTop;
    try { saidaTopo.setPointerCapture(ev.pointerId); } catch (e) {}
    var mover = function (e) { limitarSaida(e.clientX - dx, e.clientY - dy); };
    var soltar = function () {
      saidaTopo.removeEventListener('pointermove', mover);
      saidaTopo.removeEventListener('pointerup', soltar);
      saidaTopo.removeEventListener('pointercancel', soltar);
    };
    saidaTopo.addEventListener('pointermove', mover);
    saidaTopo.addEventListener('pointerup', soltar);
    saidaTopo.addEventListener('pointercancel', soltar);
    ev.preventDefault();
  });

  // ---------- Velocidade ----------
  var velInput = document.getElementById('velocidade');
  function aplicarVelocidade() {
    velocidade = Number(velInput.value) || 1;
    palcoEl.style.setProperty('--ll-dur', duracao() + 'ms');
    palcoEl.style.setProperty('--ll-flash', (FLASH_MS / velocidade) + 'ms');
    document.getElementById('velocidadeValor').textContent = String(velocidade).replace('.', ',') + 'x';
  }
  velInput.addEventListener('input', aplicarVelocidade);

  // ---------- Zoom ----------
  var zoomValor = document.getElementById('zoomValor');
  function setZoom(z) {
    zoom = Math.min(3, Math.max(0.4, Math.round(z * 10) / 10));
    camada.style.transform = 'scale(' + zoom + ')';
    zoomValor.textContent = Math.round(zoom * 100) + '%';
    posicionar([]);
  }
  document.getElementById('zoomOutBtn').addEventListener('click', function () { setZoom(zoom - 0.1); });
  document.getElementById('zoomInBtn').addEventListener('click', function () { setZoom(zoom + 0.1); });
  zoomValor.addEventListener('click', function () { setZoom(1); });
  viewport.addEventListener('wheel', function (ev) {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    setZoom(zoom + (ev.deltaY < 0 ? 0.1 : -0.1));
  }, { passive: false });

  var redim = null;
  window.addEventListener('resize', function () {
    cancelAnimationFrame(redim);
    redim = requestAnimationFrame(function () { posicionar([]); });
  });

  // ---------- Controles ----------
  document.getElementById('inserirBtn').addEventListener('click', function () { iniciarOperacao('inserir'); });
  document.getElementById('percorrerBtn').addEventListener('click', function () { iniciarOperacao('percorrer'); });
  document.getElementById('voltarBtn').addEventListener('click', voltar);
  document.getElementById('proximoBtn').addEventListener('click', proximo);
  document.getElementById('concluirBtn').addEventListener('click', concluirTudo);
  document.getElementById('playBtn').addEventListener('click', function () {
    if (tocando) pausar();
    else tocar();
  });

  document.getElementById('limparBtn').addEventListener('click', function () {
    pausar();
    op = null;
    heapCount = 0;
    base = vazio();
    renderizar(base);
    renderUI();
    setMsg('Lista esvaziada.');
  });

  document.getElementById('valor').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      iniciarOperacao('inserir');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight') {
      e.preventDefault();
      proximo();
    } else if (e.key === 'ArrowLeft') {
      e.preventDefault();
      voltar();
    } else if (e.key === ' ') {
      e.preventDefault();
      if (tocando) pausar();
      else tocar();
    }
  });

  // ---------- Modo apresentação ----------
  new SimLista.ModoApresentacao({
    botao: document.getElementById('apresentacaoBtn'),
    onMudar: function (ativo) {
      document.getElementById('apresentacaoTexto').textContent = ativo ? 'Sair (Esc)' : 'Apresentação';
      requestAnimationFrame(function () { posicionar([]); });
    }
  });

  aplicarVelocidade();
  renderizar(base);
  renderUI();
})();
</script>
</body>
</html>
